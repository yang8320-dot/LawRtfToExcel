name: Build Python EXE (Manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 取得原始碼
      uses: actions/checkout@v4

    - name: 設定 Python 3.7 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.7'

    - name: 安裝相依套件與 PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 執行 PyInstaller 進行打包 (支援拖曳套件)
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "LawRtfToExcel" --collect-all tkinterdnd2 main.py

    - name: 上傳打包好的 EXE
      uses: actions/upload-artifact@v4
      with:
        name: LawRtfToExcel-Windows-EXE
        path: dist/LawRtfToExcel.exe
        compression-level: 0
